name: Fork release

# Builds the personal fork (branch `custom`, rebased onto an upstream stable tag) for the
# fleet: Linux x64 AppImage and macOS arm64 DMG, published as a release here. The app's updater
# follows this repo's latest release, which is the build's default update feed.
# The macOS build is signed with a self-signed certificate (secrets
# MAC_SELF_SIGN_P12, MAC_SELF_SIGN_PASSWORD): not notarized, but every release keeps the same
# signature identity, which Squirrel.Mac requires to install an update.
# Tag the rebased commit as v<upstream>-ef.<n>, for example v0.1.3-ef.1.
# Repo variables: CLERK_PUBLISHABLE_KEY, CLERK_JWT_TEMPLATE, CLERK_CLI_OAUTH_CLIENT_ID,
# RELAY_URL (T3 Connect, public values from the official build).
#
# A tag push builds both. To build one platform, run it by hand on the branch:
#   gh workflow run "Fork release" -R e-frank/t3code --ref custom -f tag=v0.1.6-ef.3 -f platforms=mac
# The release creates the tag on the run's commit, and takes the other platform's files over from
# the current latest release of this repo, so its updater keeps finding a feed.

on:
  push:
    tags: ["v*-ef.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, v<upstream>-ef.<n>
        required: true
        type: string
      platforms:
        description: Platforms to build, comma-separated (linux, mac)
        required: true
        default: linux,mac
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref }}

jobs:
  build_bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.version.outputs.platforms }}
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORMS: ${{ inputs.platforms || 'linux,mac' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+.[0-9]+.[0-9]+-ef.[0-9]+$ ]] || { echo "Bad tag: $TAG" >&2; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "platforms=,${PLATFORMS// /}," >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"
      # Fork: the runner's DNS at times fails for Ubuntu's package hosts (.github/scripts/fork-ubuntu-hosts.sh).
      - timeout-minutes: 10
        run: |
          bash .github/scripts/fork-ubuntu-hosts.sh
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop
        env:
          T3CODE_TELEMETRY_CHANNEL: dev

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: build_bundle
    if: contains(needs.build_bundle.outputs.platforms, ',linux,')
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.RELAY_URL }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: build_bundle
    if: contains(needs.build_bundle.outputs.platforms, ',mac,')
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      MAC_SELF_SIGN_P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
      MAC_SELF_SIGN_PASSWORD: ${{ secrets.MAC_SELF_SIGN_PASSWORD }}
    with:
      version: ${{ needs.build_bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.RELAY_URL }}
      label: macOS arm64
      runner: macos-latest
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  release:
    name: Publish release
    needs: [build_bundle, desktop_linux_x64, desktop_mac_arm64]
    # Skipped platform jobs must not skip the release; failed ones must.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    env:
      TAG: v${{ needs.build_bundle.outputs.version }}
      PLATFORMS: ${{ needs.build_bundle.outputs.platforms }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop,cli}-*"
          path: assets
          merge-multiple: true
      # builder-debug.yml is a config dump, not a feed.
      - run: rm -f assets/builder-debug.yml
      # A platform not built in this run: copy its files from the current latest release, so
      # its updater still finds its feed file in the newest release.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          [[ "$PLATFORMS" == *,linux,* ]] || args+=(-p latest-linux.yml -p '*.AppImage' -p '*.deb' -p '*-linux-x64.tar.gz')
          [[ "$PLATFORMS" == *,mac,* ]] || args+=(-p latest-mac.yml -p '*-arm64.dmg*' -p '*-arm64.zip*' -p '*-darwin-arm64.tar.gz')
          if (( ${#args[@]} )); then
            latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "Copying the platforms not built here from $latest."
            gh release download "$latest" -R "$GITHUB_REPOSITORY" -D assets "${args[@]}"
          fi
          ls -la assets
          test -f assets/latest-linux.yml && test -f assets/latest-mac.yml
      # The checksums an SSH host verifies its server download against, as release.yml writes
      # them. The desktop app points that download at this repository (apps/desktop/src/main.ts).
      - run: |
          set -euo pipefail
          cd assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          (( ${#archives[@]} ))
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "$TAG" --notes "Fork build of ${TAG%-ef.*} with the custom patches. Built: ${PLATFORMS:1:-1}." --latest
